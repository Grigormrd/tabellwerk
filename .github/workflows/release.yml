name: Release

# On every push to main: open or update the "Version Packages" pull request
# from the changesets. When that pull request is merged (no changesets left),
# stage the new versions on npm with provenance, tag them and create draft
# GitHub releases (ADR 11). A maintainer approves the staged versions on
# npmjs.com with 2FA; the "Finish release" workflow then publishes the GitHub
# releases and checks the packages from the registry.
#
# Staging only runs when the repository variable NPM_PUBLISH is "true". npm
# accepts it through trusted publishing (OIDC): no token is stored anywhere.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version pull request or stage
    if: github.repository == 'Grigormrd/tabellwerk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tags and GitHub releases
      pull-requests: write # the "Version Packages" pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url: its placeholder token would stand in the way of OIDC.

      - run: pnpm install --frozen-lockfile

      - name: Version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: Version Packages
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.changesets.outputs.hasChangesets == 'false' && vars.NPM_PUBLISH == 'true'
        run: pnpm build

      - name: Stage on npm
        if: steps.changesets.outputs.hasChangesets == 'false' && vars.NPM_PUBLISH == 'true'
        # An explicit bash shell runs with pipefail, so a failed upload fails
        # the step even though its output goes through `tee`.
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish.mjs | tee stage.log
          if grep -q "^Staged: " stage.log; then
            {
              echo "### Waiting for approval on npm"
              echo
              grep "^Staged: " stage.log | sed 's/^Staged: /- /'
              echo
              echo "Approve them on npmjs.com (Staged Packages) or with \`npm stage approve\`."
              echo "The Finish release workflow then publishes the GitHub releases."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
